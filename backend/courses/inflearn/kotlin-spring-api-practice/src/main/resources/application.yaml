spring:
  application:
    name: blog

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/study
    username: root
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true
  
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
  
  servlet:
    encoding:
      charset: UTF-8
      force: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  pattern:
    console: "[%d{HH:mm:ss.SSS}][%-5level][%logger.%method:line%line] - %msg%n"
  level:
    org:
      hibernate:
        SQL: debug
        orm.jdbc.bind: trace

kakao:
  api:
    key: ${KAKAO_REST_API_KEY}
    url: "https://dapi.kakao.com"
