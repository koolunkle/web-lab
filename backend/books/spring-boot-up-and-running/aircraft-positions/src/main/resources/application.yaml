spring:
  application:
    name: aircraft

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/study}
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  sql:
    init:
      platform: mariadb
      mode: never # always, embedded

  jpa:
    hibernate:
      ddl-auto: create # none, update, create, create-drop
  #    properties:
  #      hibernate:
  #        format_sql: true

  cloud:
    function:
      definition: retrieveAircraftPositions
    stream:
      binders:
        rabbit:
          type: rabbit
        kafka:
          type: kafka
      bindings:
        retrieveAircraftPositions-in-0:
          destination: aircraftpositions
          group: aircraftpositions
          # active binder is chosen per profile: see application-rabbit.yaml / application-kafka.yaml
      kafka:
        binder:
          brokers: localhost:9092

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

external:
  url: ${EXTERNAL_URL:http://localhost:7634}

