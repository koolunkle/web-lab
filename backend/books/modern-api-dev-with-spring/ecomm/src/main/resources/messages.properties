error.generic=시스템이 요청을 완료할 수 없습니다, 시스템 지원 담당자에게 연락하세요.
error.http-media-type-not-supported=요청한 미디어 타입을 지원하지 않습니다. 'Content-Type' 헤더 값으로 application/json이나 application/xml를 사용하세요.
error.http-message-not-writable=Missing 'Accept' 헤더가 없습니다. 'Accept' 헤더를 추가하세요.
error.http-media-type-not-acceptable=요청한 'Accept' 헤더 값을 지원하지 않습니다. 'Accept' 값으로 application/json 이나 application/xml를 사용하세요.
error.json-parse=요청 페이로드가 유효한 JSON 객체여야 합니다.
error.http-message-not-readable=요청 페이로드는 'Content-Type'에 따라 유효한 JSON 또는 XML 객체여야 합니다.
error.http-request-method-not-supported=지원하지 않는 요청 방식입니다. (또는 허용되지 않는 HTTP 메서드입니다.)
error.constraint-violation=유효성 검증에 실패했습니다. (또는 제약 조건을 위반했습니다.)
error.illegal-argument-exception=잘못된 데이터가 전달되었습니다. (또는 유효하지 않은 인자입니다.)
error.resource-not-found=요청한 리소스를 찾을 수 없습니다.
error.customer-not-found=요청한 고객을 찾을 수 없습니다.
error.item-not-found=요청한 항목을 찾을 수 없습니다.
error.generic-already-exists=이미 존재합니다.
error.access-denied=접근 권한이 없습니다.
error.unauthorized=인증이 필요합니다.