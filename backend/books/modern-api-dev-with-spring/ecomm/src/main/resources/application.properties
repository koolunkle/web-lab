spring.application.name=ecomm

# 메시지 다국어 설정
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# 데이터베이스 연결 설정
spring.datasource.name=ecomm
spring.datasource.url=jdbc:h2:mem:ecomm;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 웹 콘솔 설정
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false

# JPA 및 하이버네이트 설정
spring.jpa.properties.hibernate.default_schema=ecomm
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway 데이터베이스 마이그레이션 설정
spring.flyway.schemas=ecomm

# JWT 서명용 키 저장소(Keystore) 설정
app.security.jwt.keystore-location=jwt-keystore.jks
app.security.jwt.keystore-password=password
app.security.jwt.key-alias=jwt-sign-key
app.security.jwt.private-key-passphrase=password

# 액추에이터 엔드포인트 노출 설정: Prometheus 스크레이핑용 엔드포인트 추가 노출
management.endpoints.web.exposure.include=health,prometheus

# 메트릭 태그 설정: 애플리케이션 이름을 공통 태그로 부여
management.metrics.tags.application=${spring.application.name}

# 분산 트레이싱 설정: 샘플링 비율 및 Zipkin 전송 엔드포인트
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# 로그스태시(ELK) 연동 설정
ecomm.logging.logstash.destination=localhost:5002
